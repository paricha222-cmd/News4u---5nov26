name: Publicar News4U
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar jornal
        run: python scripts/gerar_news4u.py
      - name: Salvar edicao
        run: |
          git config user.name "News4U Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html arquivo/
          if ! git diff --cached --quiet; then
            git commit -m "News4U: edicao automatica"
            git push
          fi
