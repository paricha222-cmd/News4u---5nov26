name: Conferir News4U
# Pesquisa e publicação são coordenadas exclusivamente pela automação do dot.
# Sem cron, escrita no repositório ou envio de mensagens externas neste job.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar edição atual sem gerar outra
        run: |
          python -m unittest discover -s tests -v
          SOURCE=$(python -c 'import json; print(json.load(open("latest.json"))["source_path"])')
          python scripts/publicar_edicao.py "$SOURCE" --check
          python scripts/verificar_publicacao.py
